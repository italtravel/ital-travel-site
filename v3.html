<style>
/* Version 3: a Tuscan landscape behind the whole page, with one big rounded white sheet on top of it. Same data, languages, prices and bookings as the main site. */
:root {
  color-scheme: light;
  --sheet: #FAFAF6; --ink: #142019; --muted: #56625B; --line: #E2E6DF; --verde: #005A2B; --rosso: #CD212A; --white: #FFFFFF;
  --sans: "Outfit", "Noto Sans Armenian", system-ui, -apple-system, "Segoe UI", sans-serif;
  --e: cubic-bezier(.2,.75,.2,1);
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #1F3A2B; color: var(--ink); font: 400 1.03rem/1.5 var(--sans); overflow-x: hidden; }
body.lock { overflow: hidden; }
h1, h2, h3, p, ul, figure { margin: 0; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--rosso); outline-offset: 2px; }

.scene { position: fixed; inset: 0; z-index: -1; background: #1F3A2B; }
.scene img { object-position: 50% 40%; }
.scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,20,12,.5), rgba(8,20,12,.08) 22%, rgba(8,20,12,.2)); }
.frame { max-width: 1240px; margin-inline: auto; padding-left: var(--gl); padding-right: var(--gr); }

/* Header */
.head { display: flex; align-items: center; gap: 14px; min-height: 76px; padding-top: env(safe-area-inset-top, 0px); color: var(--white); }
.head a.brand { color: #fff; margin-right: auto; }
.head a.brand small { color: #fff; }
.head a.brand i { box-shadow: none; }
.links { display: flex; gap: 22px; font-size: .97rem; }
.links a { text-decoration: none; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.links a:hover { text-decoration: underline; text-underline-offset: 4px; }
.sw { display: flex; }
.sw button { min-width: 36px; min-height: 44px; padding: 0 4px; font-size: .92rem; opacity: .8; text-shadow: 0 1px 8px rgba(0,0,0,.35); }
.sw button[aria-pressed="true"] { opacity: 1; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.pl { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 46px; padding: 10px 22px; border-radius: 99px; text-decoration: none; font-weight: 500; line-height: 1.2; text-align: center; transition: background .2s, transform .2s var(--e); }
.pl:hover { transform: translateY(-2px); }
.pl.line { border: 1px solid rgba(255,255,255,.85); }
.pl.line:hover { background: rgba(255,255,255,.14); }
.pl.red { background: var(--rosso); color: #fff; }
.pl.red:hover { background: #E02A33; }

/* The sheet */
.sheet-w { background: var(--sheet); border-radius: 30px; padding: 8px 8px 0; }
.hero { position: relative; isolation: isolate; border-radius: 24px; overflow: hidden; min-height: clamp(380px, 62vh, 560px); display: grid; align-items: center; color: #fff; }
.hero > img { position: absolute; inset: 0; z-index: -2; object-position: 50% 42%; }
.hero::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(90deg, rgba(8,20,12,.72), rgba(8,20,12,.3) 52%, rgba(8,20,12,0) 78%), linear-gradient(180deg, rgba(8,20,12,0) 60%, rgba(8,20,12,.3)); }
.h-tx { padding: 28px clamp(20px, 5vw, 56px) 76px; display: grid; gap: 14px; justify-items: start; max-width: 860px; }
.hero h1 { font-weight: 700; font-size: clamp(2.3rem, 1.5rem + 2.6vw, 3.7rem); line-height: 1.04; letter-spacing: -.02em; text-wrap: balance; }
.hero h1 em { display: block; font-style: normal; font-size: .52em; font-weight: 600; line-height: 1.15; letter-spacing: -.01em; margin-top: .3em; }
.hero p { max-width: 46ch; font-size: 1.06rem; }
.search { position: relative; z-index: 2; margin: -48px auto 0; width: min(1040px, calc(100% - 48px)); background: #fff; border-radius: 99px; display: grid; grid-template-columns: 1.1fr 1fr 1fr auto; align-items: center; padding: 10px 12px 10px 18px; box-shadow: 0 22px 44px -26px rgba(10,30,18,.6), 0 0 0 1px var(--line); }
.f { display: flex; align-items: center; gap: 12px; padding: 4px 16px; border-right: 1px solid var(--line); min-width: 0; }
.f:nth-child(3) { border-right: 0; }
.f .ic { flex: none; width: 40px; height: 40px; border-radius: 50%; background: var(--sheet); display: grid; place-items: center; }
.f svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.f > div { min-width: 0; flex: 1; display: grid; }
.f label, .f .lb { font-size: .86rem; font-weight: 500; }
.f select, .f input { border: 0; background: transparent; padding: 0; width: 100%; min-width: 0; color: var(--muted); min-height: 26px; }
.gst { display: flex; align-items: center; gap: 10px; color: var(--muted); min-height: 26px; }
.gst button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); line-height: 1; display: grid; place-items: center; color: var(--ink); }
.gst output { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.go { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; padding: 10px 28px; border-radius: 99px; background: var(--verde); color: #fff; font-weight: 500; transition: background .2s; }
.go:hover { background: #00733a; }
.go svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

/* Services row */
.svc { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; padding: 34px clamp(12px, 3vw, 36px) 8px; }
.svc a { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--muted); min-width: 0; line-height: 1.25; font-weight: 500; font-size: .95rem; transition: color .2s; }
.svc a:hover { color: var(--verde); }
.svc svg { flex: none; width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }

/* Sections inside the sheet */
.sec { padding: clamp(36px, 5vw, 60px) clamp(12px, 3vw, 36px); }
.rule { display: block; width: 62px; height: 3px; background: var(--rosso); border-radius: 3px; margin-bottom: 18px; }
.h2 { font-weight: 700; font-size: clamp(1.8rem, 1.45rem + 1.5vw, 2.7rem); line-height: 1.08; letter-spacing: -.015em; text-wrap: balance; }
.sub { color: var(--muted); margin-top: 10px; max-width: 62ch; }
.t-grid { display: grid; grid-template-columns: minmax(0, 240px) minmax(0, 1fr); gap: 28px; align-items: start; }
.arrows { display: flex; gap: 12px; margin-top: 26px; }
.arrows button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: #fff; transition: background .2s, color .2s; font-size: 1.1rem; }
.arrows #t-next { background: var(--verde); border-color: var(--verde); color: #fff; }
.arrows button:disabled { opacity: .45; cursor: default; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.chip { min-height: 40px; padding: 7px 15px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-size: .94rem; transition: background .2s, color .2s; }
.chip:hover { border-color: var(--verde); }
.chip[aria-pressed="true"] { background: var(--verde); border-color: var(--verde); color: #fff; }
.rail { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 32px) / 3); gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; padding-bottom: 2px; }
.rail::-webkit-scrollbar { display: none; }
.pc { position: relative; display: block; width: 100%; aspect-ratio: 5 / 8; max-height: 460px; border-radius: 20px; overflow: hidden; text-align: left; color: #fff; scroll-snap-align: start; background: var(--line); }
.pc img { position: absolute; inset: 0; transition: transform .6s var(--e); }
.pc:hover img { transform: scale(1.04); }
.pc::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,20,12,0) 50%, rgba(8,20,12,.82)); }
.pc .ar { position: absolute; z-index: 2; right: 14px; top: 14px; width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,.88); color: var(--ink); display: grid; place-items: center; }
.pc .tx { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 16px 18px 18px; display: grid; gap: 3px; }
.pc b { font-weight: 600; font-size: 1.14rem; line-height: 1.2; }
.pc small { font-size: .94rem; }
.c3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 24px; }
.tile { border-radius: 20px; overflow: hidden; background: #fff; border: 1px solid var(--line); min-width: 0; display: grid; grid-template-rows: auto 1fr; }
.tile .ph { aspect-ratio: 4 / 3; overflow: hidden; }
.tile .tx { padding: 16px 18px 18px; display: grid; gap: 8px; align-content: start; justify-items: start; }
.tile h3, .row h3 { font-weight: 600; font-size: 1.14rem; line-height: 1.25; }
.tile p, .row p { color: var(--muted); font-size: .97rem; }
.tile a, .row a { color: var(--verde); font-weight: 600; text-underline-offset: 4px; padding-block: 4px; }
.who { display: grid; grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 28px; align-items: start; }
.who video { display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 20px; background: var(--line); }
.list { display: grid; gap: 12px; margin-top: 20px; }
.row { display: grid; grid-template-columns: 130px minmax(0, 1fr); border-radius: 18px; overflow: hidden; background: #fff; border: 1px solid var(--line); }
.row .tx { padding: 14px 16px; display: grid; gap: 4px; justify-items: start; }
.gg { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 24px; }
.gc { display: grid; justify-items: center; text-align: center; gap: 10px; text-decoration: none; width: 180px; }
.gc-ph { display: grid; place-items: center; width: 130px; height: 130px; border-radius: 50%; overflow: hidden; background: var(--verde); color: #fff; font-weight: 700; font-size: 2.8rem; }
.gc b { display: block; font-weight: 600; }
.gc span.r, .gc i { display: block; font-style: normal; color: var(--muted); font-size: .9rem; }
.ig-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 12px; }
.ig-head a { color: var(--verde); font-weight: 600; text-underline-offset: 4px; }
.ig-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 22px; }
.ig-grid a { flex: 0 0 calc((100% - 20px) / 3); position: relative; display: block; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: var(--line); }
.ig-grid img { position: absolute; inset: 0; }
.ig-grid svg { position: absolute; right: 12px; top: 12px; width: 24px; height: 24px; color: #fff; filter: drop-shadow(0 1px 4px rgba(0,0,0,.5)); }

/* Closing band over the landscape */
.close { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px; padding-block: clamp(44px, 7vw, 76px); color: #fff; text-shadow: 0 1px 14px rgba(0,0,0,.5); }
.badge { width: 124px; height: 124px; }
.badge text { font: 500 12.4px var(--sans); letter-spacing: 1.6px; fill: #fff; }
.close .mid { display: grid; justify-items: center; text-align: center; gap: 10px; }
.close a.brand { margin: 0; color: #fff; }
.close a.brand b { font-size: 2.1rem; }
.close a.brand small { color: #fff; font-size: .78rem; }
.close a.brand i { box-shadow: none; }
.script { justify-self: end; text-align: right; font: italic 400 1.8rem/1.12 "Instrument Serif", "Noto Serif Armenian", Georgia, serif; transform: rotate(-5deg); white-space: pre-line; max-width: 11em; }

/* Tour detail */
.sheet { position: fixed; inset: 0; z-index: 30; background: rgba(8,20,12,.6); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) var(--gr) 16px var(--gl); animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.s-box { width: min(980px, 100%); height: min(740px, 100%); background: var(--sheet); border-radius: 26px; overflow: hidden; display: grid; grid-template-columns: minmax(0, 44fr) minmax(0, 56fr); animation: up .45s var(--e) both; }
@keyframes up { from { transform: translateY(24px) scale(.97); } }
.s-pic { position: relative; min-height: 0; overflow: hidden; }
.s-pic img { position: absolute; inset: 0; }
.s-body { overflow-y: auto; padding: 22px 24px 26px; display: grid; gap: 14px; align-content: start; min-width: 0; min-height: 0; }
.s-top { display: flex; justify-content: flex-end; }
.s-close { min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 99px; font-size: .95rem; background: #fff; }
.s-body h2 { font-weight: 700; font-size: clamp(1.6rem, 1.3rem + 1.2vw, 2.3rem); line-height: 1.1; letter-spacing: -.01em; }
.s-price { font-size: 1.15rem; font-weight: 600; color: var(--verde); }
.s-desc, .s-total, .s-note { color: var(--muted); }
.s-total { font-size: .95rem; }
.s-total b { color: var(--ink); font-weight: 600; }
.s-note { font-size: .92rem; }
.step { display: inline-flex; align-items: center; border: 1px solid var(--line); background: #fff; border-radius: 99px; justify-self: start; }
.step button { width: 46px; height: 46px; font-size: 1.15rem; }
.step output { min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.acts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; min-height: 48px; padding: 10px 16px; border-radius: 99px; text-decoration: none; font-weight: 500; line-height: 1.2; border: 1px solid var(--line); background: #fff; }
.btn:hover { border-color: var(--verde); }
.btn.main { grid-column: 1 / -1; background: var(--rosso); border-color: var(--rosso); color: #fff; }
.btn.main:hover { background: #E02A33; }
.s-sec h3 { font-size: 1.02rem; font-weight: 600; margin-bottom: 6px; }
.s-sec ul { list-style: none; padding: 0; }
.s-sec li { padding: 8px 0; border-top: 1px solid var(--line); font-size: .97rem; line-height: 1.35; }

.fab { position: fixed; z-index: 9; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: #1F8A4C; color: #fff; }
.fab svg { width: 28px; height: 28px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
@media (max-width: 980px) {
  .links, .pl.line { display: none; }
  .svc { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .t-grid { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .arrows { display: none; }
  .rail { grid-auto-columns: min(66vw, 300px); }
  .c3 { grid-template-columns: minmax(0, 1fr); }
  .who { grid-template-columns: minmax(0, 1fr); }
  .who video { width: min(250px, 70%); margin-inline: auto; }
  .close { grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; }
  .badge { display: none; }
  .script { justify-self: center; text-align: center; font-size: 1.5rem; }
}
@media (max-width: 760px) {
  .head { min-height: 66px; gap: 6px; }
  .head .pl.red { display: none; }
  .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding-inline: 4px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  .hero { min-height: 56vh; }
  .hero p { display: none; }
  .h-tx { padding-bottom: 120px; }
  .search { border-radius: 22px; margin-top: -92px; grid-template-columns: minmax(0, 1fr); padding: 8px 12px 12px; width: calc(100% - 20px); }
  .f { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; }
  .f:nth-child(3) { border-bottom: 0; }
  .f .ic { width: 36px; height: 36px; }
  .go { width: 100%; min-height: 50px; margin-top: 4px; }
  .sheet { padding: 0; }
  .s-box { width: 100%; height: 100%; border-radius: 0; grid-template-columns: minmax(0, 1fr); grid-template-rows: 26vh minmax(0, 1fr); }
  .s-body { padding: 14px var(--gr) 90px var(--gl); }
  .ig-grid a { flex-basis: calc((100% - 10px) / 2); }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-wa" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.2.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"/></symbol>
</svg>
<div class="scene" aria-hidden="true"><img src="img/tu-villa-vineyards.jpg" alt=""></div>

<div class="frame" id="top">
  <header class="head">
    <a class="brand light" href="#top" aria-label="Ital Travel"><b>Ital<span>·</span>Travel</b><i></i><small>տուրեր իտալիայում</small></a>
    <nav class="links" aria-label="Main"><a href="#tours" data-t="navTours"></a><a href="#occasions" data-t="o3t"></a><a href="#team" data-t="navGuides"></a><a href="#site-foot" data-t="navContact"></a></nav>
    <div class="sw" role="group" aria-label="Language"><button type="button" data-lang="hy" aria-pressed="true">ՀԱՅ</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div>
    <div class="sw" role="group" aria-label="Currency"><button type="button" data-cur="EUR" aria-pressed="true" title="Euro">€</button><button type="button" data-cur="AMD" aria-pressed="false" title="Armenian dram">֏</button><button type="button" data-cur="USD" aria-pressed="false" title="US dollar">$</button></div>
    <a class="pl line" href="page.html?p=partner" data-t="heroJoin"></a>
    <a class="pl red" href="#tours" data-t="navBook"></a>
  </header>

  <main class="sheet-w">
    <section class="hero">
      <img src="img/tu-town-sunset.jpg" alt="A Tuscan hill town at sunset" fetchpriority="high">
      <div class="h-tx">
        <h1><span data-t="h1a"></span><em data-t="h1b"></em></h1>
        <p data-t="lead"></p>
        <a class="pl red" href="#tours"><span data-t="cta"></span><span aria-hidden="true">→</span></a>
      </div>
    </section>
    <form class="search" id="search" role="search" novalidate>
      <div class="f"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21Z"/><circle cx="12" cy="9.5" r="2.4"/></svg></span><div><label for="s-loc" data-t="sLoc"></label><select id="s-loc"></select></div></div>
      <div class="f"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="6" width="16" height="14" rx="2.5"/><path d="M4 11h16M9 3.5V8M15 3.5V8"/></svg></span><div><label for="s-date" data-t="sDate"></label><input id="s-date" type="date"></div></div>
      <div class="f"><span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c.8-4 3.5-6 7-6s6.2 2 7 6"/></svg></span><div><span class="lb" id="s-ppl-l" data-t="sPeople"></span><div class="gst"><button type="button" data-sp="-1" aria-label="−1">−</button><output id="s-ppl" aria-labelledby="s-ppl-l" aria-live="polite">2</output><button type="button" data-sp="1" aria-label="+1">+</button></div></div></div>
      <button class="go" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><span data-t="sGo"></span></button>

<script>
/* Anonymous visit counting and partner links: the same as on the main page.
   Only after the visitor presses "Accept" in the cookie banner (IT.consent() === "all"). */
(function () {
  var API = (window.ITAL_CONFIG || {}).API_URL || "";
  function rid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function ok() { return IT.consent() === "all"; }
  var v = null, s = null;
  function ids() {
    if (v) return;
    try { v = localStorage.getItem("it-v"); if (!v) { v = rid(); localStorage.setItem("it-v", v); } } catch (e) { v = rid(); }
    try { s = sessionStorage.getItem("it-s"); if (!s) { s = rid(); sessionStorage.setItem("it-s", s); } } catch (e) { s = rid(); }
  }
  function source() {
    var q = new URLSearchParams(location.search), u = q.get("utm_source") || q.get("src");
    if (q.get("ref")) return "Partner";
    if (u) return u.slice(0, 30);
    var r = document.referrer || "";
    if (!r) return "Direct";
    var h = ""; try { h = new URL(r).hostname.replace(/^www\./, ""); } catch (e) { return "Other"; }
    if (h === location.hostname) return "Direct";
    if (/instagram/.test(h)) return "Instagram";
    if (/facebook|fb\.|messenger/.test(h)) return "Facebook";
    if (/google\./.test(h)) return "Google";
    if (/whatsapp|wa\.me/.test(h)) return "WhatsApp";
    if (/t\.me|telegram/.test(h)) return "Telegram";
    if (/youtube/.test(h)) return "YouTube";
    if (/tiktok/.test(h)) return "TikTok";
    if (/bing|yandex|duckduckgo/.test(h)) return "Other search";
    return h.slice(0, 30);
  }
  var src = source(), sent = {};
  window.IT_TRACK = function (e, detail) {
    if (!API || !ok()) return;
    ids();
    var key = e + "|" + (detail || "");
    if (e !== "view" && sent[key]) return; sent[key] = 1;
    var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (err) {}
    var body = JSON.stringify({ action: "track", e: e, d: detail || "", v: v, s: s, src: src, l: (window.IT && IT.state.lang) || "hy",
      dev: matchMedia("(max-width: 760px)").matches ? "mobile" : "desktop", tz: tz, p: location.pathname });
    try { if (navigator.sendBeacon && navigator.sendBeacon(API, new Blob([body], { type: "text/plain;charset=utf-8" }))) return; } catch (err) {}
    try { fetch(API, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body }); } catch (err) {}
  };
  var counted = false, REF_DAYS = 60;
  var code = (new URLSearchParams(location.search).get("ref") || "").trim().toUpperCase();
  if (!/^[A-Z0-9_-]{2,20}$/.test(code)) code = "";
  function start() {
    if (counted || !ok()) return; counted = true;
    if (!/[?&]notrack/.test(location.search)) setTimeout(function () { window.IT_TRACK("view"); }, 600);
    if (code) {
      try { localStorage.setItem("it-ref", JSON.stringify({ c: code, t: Date.now() })); } catch (e) {}
      setTimeout(function () { window.IT_TRACK("ref_click", code); }, 700);
    }
  }
  window.IT_REF = function () {
    if (code) return code;
    try { var o = JSON.parse(localStorage.getItem("it-ref") || "null"); if (o && Date.now() - o.t < REF_DAYS * 864e5) return o.c; } catch (e) {}
    return "";
  };
  start();
  document.addEventListener("it-consent", start);
})();

<script>

      var L = IT.L(x);

    }).join("");

  rail.addEventListener("click", function (e) { var c = e.target.closest(".pc"); if (c) openSheet(byId(c.dataset.id)); });
