<style>
/* Partner page: Riviera palette, one column of steps → terms → form; the private area is tiles, link, then a list. */
:root {
  color-scheme: light;
  --sand: #FAFAF6; --white: #FFFFFF; --ink: #142019; --muted: #56625B; --line: #E2E6DF;
  --sea: #4E7D63; --sea-d: #3A5F4A; --mint: #E3ECE6; --coral: #8A4A4D;
  --st-requested: #B86E00; --st-confirmed: #4E7D63; --st-done: #2F6DB5; --st-cancelled: #C42630;
  --display: "Noto Serif Armenian", Georgia, serif;
  --body: "Outfit", "Noto Sans Armenian", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sand); color: var(--ink); font-family: var(--body); font-size: .98rem; line-height: 1.6; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; line-height: 1.12; text-wrap: balance; }
html[lang="hy"] h1, html[lang="hy"] h2, html[lang="hy"] h3 { font-weight: 600; line-height: 1.25; }
p { margin: 0; }
a { color: inherit; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 6px; }
.tricolore { height: 5px; background: linear-gradient(90deg, #4E7D63 0 33.34%, #FFFFFF 0 66.67%, #8A4A4D 0); }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top { background: rgba(250,250,246,.96); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 60px; }
.logo { margin-right: auto; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo i { width: 28px; height: 20px; border-radius: 3px; background: linear-gradient(90deg, #4E7D63 0 33.34%, #FFFFFF 0 66.67%, #8A4A4D 0); box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.logo b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 1.3rem; }
.lang { display: flex; padding: 3px; background: var(--white); border-radius: 999px; box-shadow: 0 4px 12px -8px rgba(20,32,25,.4); }
.lang button { border: 0; background: transparent; border-radius: 999px; padding: 4px 12px; min-height: 32px; font-weight: 700; font-size: .82rem; color: var(--sea); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--sea); color: var(--white); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 10px 22px; border-radius: 999px; border: 2px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; }
.btn-sea { background: var(--sea); color: var(--white); }
.btn-sea:hover { background: var(--sea-d); }
.btn-line { background: var(--white); border-color: var(--line); color: var(--ink); }
.btn:disabled { opacity: .55; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; background: var(--white); color: var(--sea); box-shadow: 0 6px 16px -10px rgba(16,42,58,.4); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
main { padding-block: 34px 70px; display: grid; gap: 34px; }
.hero { display: grid; gap: 14px; }
.hero h1 { font-size: clamp(2rem, 1.3rem + 3vw, 3.3rem); }
.hero h1 em { font-style: normal; color: var(--sea); }
.lead { color: var(--muted); font-size: 1.05rem; max-width: 62ch; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; counter-reset: s; }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }
.steps li { counter-increment: s; background: var(--white); border-radius: 20px; padding: 18px; display: grid; gap: 6px; }
.steps li::before { content: counter(s); width: 38px; height: 38px; border-radius: 50%; background: var(--mint); color: var(--sea-d); display: grid; place-items: center; font-weight: 800; }
.steps h3 { font-size: 1.2rem; }
.steps p { color: var(--muted); font-size: .92rem; }
.card { background: var(--white); border-radius: 22px; padding: clamp(18px, 3vw, 28px); display: grid; gap: 14px; min-width: 0; }
.card h2 { font-size: 1.5rem; }
.terms { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; color: var(--muted); }
.form { display: grid; gap: 12px; }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .r2 { grid-template-columns: 1fr; } }
.f { display: grid; gap: 5px; font-weight: 600; font-size: .86rem; min-width: 0; }
.f input, .f textarea { font-weight: 400; font-size: .98rem; background: var(--sand); border: 2px solid transparent; border-radius: 12px; padding: 9px 12px; min-height: 46px; width: 100%; }
.f textarea { min-height: 90px; resize: vertical; }
.f input:focus, .f textarea:focus { outline: none; border-color: var(--sea); background: var(--white); }
.f input[aria-invalid="true"] { border-color: var(--coral); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: .9rem; }
.check input { width: 20px; height: 20px; accent-color: var(--sea); margin-top: 2px; flex: none; }
.msg { font-weight: 600; font-size: .92rem; border-radius: 12px; padding: 10px 12px; }
.msg.bad { background: #FDF0F0; color: var(--coral); } .msg.good { background: var(--mint); color: var(--sea-d); }
/* Private area */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.tile { background: var(--white); border-radius: 18px; padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.tile span { font-size: .8rem; font-weight: 600; color: var(--muted); }
.tile b { font-size: 1.7rem; font-weight: 700; line-height: 1.15; }
.tile small { font-size: .76rem; color: var(--muted); }
.tile.hl { background: var(--sea); color: var(--white); } .tile.hl span, .tile.hl small { color: #E3ECE6; }
.linkbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--mint); border-radius: 16px; padding: 12px; }
.linkbox code { flex: 1 1 260px; font-size: .95rem; background: var(--white); padding: 9px 12px; border-radius: 10px; overflow-wrap: anywhere; user-select: all; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 520px; font-size: .9rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); }
th { font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
td.n { font-variant-numeric: tabular-nums; white-space: nowrap; }
.st { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .8rem; color: var(--c); }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.empty { color: var(--muted); text-align: center; padding: 18px; }
.note { color: var(--muted); font-size: .84rem; }
footer { border-top: 1px solid var(--line); }
footer .wrap { padding-block: 22px; display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; color: var(--muted); font-size: .88rem; }
</style>

  function t() { return S[lang]; }
  function eur(n) { return "€" + (Math.round(n * 100) / 100).toLocaleString("en-US"); }

  function fmtDate(s) { if (!s) return ""; var p = s.split("-"); return p[2] + "." + p[1] + "." + p[0]; }

  function renderStatic() {
    document.documentElement.lang = lang;

      "</div>" +

    $("copy").onclick = function () {

      function sel() { var r = document.createRange(); r.selectNodeContents($("reflink")); var s2 = getSelection(); s2.removeAllRanges(); s2.addRange(r); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-lang]"); if (!b) return;

  renderStatic();
  if (P && K) {
    $("program").hidden = true; $("area").hidden = false; renderArea();

    else api({ action: "partner_stats", p: P, k: K }).then(function (r) { data = r && r.ok ? r : { error: true }; renderArea(); }).catch(function () { data = { error: true }; renderArea(); });
  }
})();
