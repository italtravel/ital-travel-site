<link rel="stylesheet" href="footer.css">
<style>
/* Option E — "Riviera": an Italian summer day. Sea teal, coral and lemon from the Cinque Terre houses,
   photos cut into arches, circles and pills that float, a bento grid of places, and a moving sea. Light by choice. */
:root {
  color-scheme: light;
  --white: #FFFFFF;
  --sand: #FFF5E6;
  --sea: #0F7C88;
  --sea-d: #0A4A57;
  --coral: #FF6A4D;
  --lemon: #FFD54A;
  --pink: #FF9FB2;
  --ink: #102A3A;
  --muted: #52677A;
  --line: #EADFCC;
  --display: "Noto Serif Armenian", Georgia, serif;
  --body: "Outfit", "Noto Sans Armenian", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 80px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--sand); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.6; overflow-x: hidden; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.04; margin: 0; text-wrap: balance; }
html[lang="hy"] h1, html[lang="hy"] h2, html[lang="hy"] h3 { font-weight: 600; line-height: 1.2; }
p { margin: 0; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; border-radius: 6px; }
.wrap { max-width: 1220px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band { padding-block: clamp(60px, 8vw, 110px); }
.pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: .82rem; letter-spacing: .08em; text-transform: uppercase; padding: 7px 14px; border-radius: 999px; background: var(--white); color: var(--sea); box-shadow: 0 6px 16px -10px rgba(16,42,58,.4); }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); }
.h2 { font-size: clamp(2.2rem, 1.4rem + 3.4vw, 4rem); margin-top: 16px; }
.h2 .hl { background: linear-gradient(transparent 62%, var(--lemon) 62% 92%, transparent 92%); padding: 0 .1em; }
.lede { color: var(--muted); max-width: 60ch; margin-top: 16px; font-size: 1.1rem; }
.rv { transition: transform .8s var(--ease); }
.rv.pre { transform: translateY(40px) scale(.98); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { animation: none !important; transition: none !important; } .rv.pre { transform: none; } }

.optbar { background: var(--sea-d); color: var(--white); font-size: .82rem; }
.optbar .wrap { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; min-height: 36px; padding-block: 4px; }
.optbar a { color: var(--lemon); font-weight: 700; text-decoration: none; }
.optbar a[aria-current] { color: var(--white); text-decoration: underline; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: .55em; min-height: 52px; padding: 12px 28px; border-radius: 999px; font: inherit; font-weight: 700; text-decoration: none; border: 2px solid transparent; cursor: pointer; transition: transform .25s var(--ease), box-shadow .25s; }
.btn:hover { transform: translateY(-3px) rotate(-1deg); }
.btn-coral { background: var(--coral); color: var(--white); box-shadow: 0 12px 24px -12px rgba(255,106,77,.9); }
.btn-sea { background: var(--sea); color: var(--white); box-shadow: 0 12px 24px -12px rgba(15,124,136,.9); }
.btn-lemon { background: var(--lemon); color: var(--ink); }
.btn-white { background: var(--white); color: var(--ink); border-color: var(--ink); }
.btn svg { width: 20px; height: 20px; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: rgba(255,245,230,.9); }
.top .wrap { display: flex; align-items: center; gap: 24px; min-height: 72px; }
.logo { margin-right: auto; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo .dot { width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(var(--sea) 0 33%, var(--white) 0 66%, var(--coral) 0); border: 2px solid var(--ink); animation: spin 14s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.logo b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 1.6rem; line-height: 1; }
.logo b span { color: var(--coral); }
.nav { display: flex; gap: 6px; font-weight: 600; font-size: .95rem; }
.nav a { text-decoration: none; padding: 8px 14px; border-radius: 999px; transition: background .2s; }
.nav a:hover { background: var(--white); }
.lang { display: flex; padding: 4px; background: var(--white); border-radius: 999px; flex: none; box-shadow: 0 6px 16px -10px rgba(16,42,58,.35); }
.lang button { font: inherit; font-weight: 700; font-size: .85rem; min-height: 36px; padding: 4px 14px; border: 0; border-radius: 999px; background: transparent; color: var(--sea); cursor: pointer; transition: background .2s, color .2s; }
.lang button[aria-pressed="true"] { background: var(--sea); color: var(--white); }
.menu-btn { display: none; font: inherit; font-weight: 700; min-height: 42px; padding: 4px 16px; border: 0; border-radius: 999px; background: var(--white); color: var(--ink); cursor: pointer; }
.nav a { white-space: nowrap; }
/* below 1140px the menu, language, currency and Book button no longer fit in one row (Armenian labels are long), so the menu folds into "Menu" */
@media (max-width: 1140px) {
  .menu-btn { display: inline-flex; align-items: center; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; flex-direction: column; gap: 0; background: var(--sand); border-bottom: 2px solid var(--line); padding: 6px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
  .nav.open { display: flex; }
  .nav a { padding: 12px 0; border-radius: 0; border-bottom: 1px solid var(--line); }
}
@media (max-width: 960px) { .top .book { display: none; } }

/* Hero with floating photo mosaic */
.hero { position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; right: -12vw; top: -14vw; width: 58vw; aspect-ratio: 1; border-radius: 50%; background: var(--lemon); opacity: .55; }
.hero .wrap { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(30px, 5vw, 70px); align-items: center; padding-block: clamp(36px, 5vw, 70px) clamp(60px, 7vw, 100px); }
@media (max-width: 900px) { .hero .wrap { grid-template-columns: 1fr; } }
.hero h1 { font-size: clamp(3rem, 1.6rem + 5.6vw, 6.6rem); margin-top: 20px; letter-spacing: -.01em; }
html[lang="hy"] .hero h1 { font-size: clamp(2.3rem, 1.3rem + 3.8vw, 4.6rem); }
.hero h1 em { display: block; font-style: normal; color: var(--sea); }
@keyframes dots { to { background-position: 22px 0; } }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.mosaic { position: relative; aspect-ratio: 1 / 1.05; max-width: 100%; width: min(100%, 580px); justify-self: center; }
.mosaic figure { position: absolute; margin: 0; overflow: hidden; box-shadow: 0 30px 50px -30px rgba(16,42,58,.6); border: 6px solid var(--white); animation: float 7s ease-in-out infinite; }
.mosaic img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
.mosaic figure:hover img { transform: scale(1.08); }
.m1 { left: 0; top: 4%; width: 52%; height: 78%; border-radius: 999px 999px 26px 26px; }
.m1 img { object-position: 50% 50%; }
.m2 { right: 2%; top: 0; width: 42%; aspect-ratio: 1; border-radius: 50%; animation-delay: -2s !important; }
.m3 { right: 0; bottom: 4%; width: 44%; height: 46%; border-radius: 26px; animation-delay: -4s !important; }
.m3 img { object-position: 50% 30%; }
.m4 { left: 18%; bottom: 0; width: 34%; height: 24%; border-radius: 999px; animation-delay: -5.5s !important; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(.8deg); } }
.spin-badge { position: absolute; left: 44%; top: 40%; width: 128px; height: 128px; z-index: 3; border-radius: 50%; background: var(--coral); color: var(--white); display: grid; place-items: center; box-shadow: 0 16px 30px -14px rgba(255,106,77,.9); }
.spin-badge svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); animation: spin 16s linear infinite; }
.spin-badge svg text { font-family: "Outfit", sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 2.4px; fill: var(--white); text-transform: uppercase; }
.spin-badge b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 1.9rem; }
@media (max-width: 520px) { .spin-badge { width: 100px; height: 100px; } .spin-badge b { font-size: 1.4rem; } }

/* Marquee */
.marquee { background: var(--sea); color: var(--white); overflow: hidden; transform: rotate(-1.5deg); margin: 0 -10px; box-shadow: 0 12px 30px -20px rgba(10,74,87,.8); }
.marquee .track { display: flex; width: max-content; animation: slide 34s linear infinite; }
.marquee span { font-family: "Young Serif", Georgia, serif; font-size: clamp(1.4rem, 1rem + 1.4vw, 2.2rem); padding: 14px 26px; white-space: nowrap; display: inline-flex; align-items: center; gap: 52px; }
.marquee span::after { content: "✺"; color: var(--lemon); }
@keyframes slide { to { transform: translateX(-50%); } }

/* Audience */
.aud { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 24px; margin-top: 46px; }
.aud article { border-radius: 30px; padding: 28px; display: flex; flex-direction: column; gap: 12px; min-width: 0; position: relative; overflow: hidden; transition: transform .35s var(--ease); }
.aud article:hover { transform: translateY(-6px) rotate(-.6deg); }
.aud article:nth-child(1) { background: var(--coral); color: var(--white); }
.aud article:nth-child(2) { background: var(--lemon); }
.aud article:nth-child(3) { background: var(--sea); color: var(--white); }
.aud .ph { width: 96px; height: 96px; border-radius: 50%; overflow: hidden; border: 4px solid var(--white); }
.aud .ph img { width: 100%; height: 100%; object-fit: cover; }
.aud h3 { font-size: 1.8rem; }
.aud a { margin-top: auto; font-weight: 700; text-underline-offset: 4px; }

/* Bento of places */
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 190px; grid-auto-flow: dense; gap: 16px; margin-top: 44px; }
@media (max-width: 820px) { .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 170px; } }
.tile { position: relative; border-radius: 26px; overflow: hidden; border: 0; padding: 0; cursor: pointer; font: inherit; color: var(--white); text-align: left; isolation: isolate; background: var(--bg, var(--sea)); transition: transform .35s var(--ease); }
.tile:hover { transform: scale(.98); }
.tile img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform 1.2s var(--ease); }
.tile:hover img { transform: scale(1.1); }
.tile.ph::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 40%, rgba(10,40,52,.8)); }
.tile .t { position: absolute; left: 18px; right: 18px; bottom: 16px; display: grid; }
.tile .t b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 1.7rem; line-height: 1.05; }
.tile .t span { font-size: .88rem; opacity: .95; }
.tile .t i { font-style: normal; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .9; }
.tile.big { grid-column: span 2; grid-row: span 2; }
.tile.big .t b { font-size: 2.6rem; }
.tile.tall { grid-row: span 2; }
.tile.wide { grid-column: span 2; }
.tile.dark { color: var(--ink); }
.tile .arrow { position: absolute; top: 14px; right: 14px; width: 40px; height: 40px; border-radius: 50%; background: var(--white); color: var(--ink); display: grid; place-items: center; font-weight: 800; transform: scale(0); transition: transform .3s var(--ease); }
.tile:hover .arrow, .tile:focus-visible .arrow { transform: scale(1); }

/* Tours */
.tours { background: var(--white); border-radius: 48px 48px 0 0; }
.tours .head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 24px; }
.calc { display: flex; align-items: center; gap: 14px; background: var(--lemon); border-radius: 999px; padding: 8px 8px 8px 22px; }
.calc .lbl { font-weight: 700; font-size: .92rem; line-height: 1.25; }
.calc .lbl small { display: block; font-weight: 500; font-size: .8rem; color: #5B4A10; }
.calc button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--white); color: var(--ink); font: inherit; font-size: 1.5rem; font-weight: 700; cursor: pointer; transition: transform .2s var(--ease); }
.calc button:hover { transform: scale(1.1); }
.calc output { min-width: 2ch; text-align: center; font-family: "Young Serif", Georgia, serif; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; display: inline-block; }
.calc output.bump { animation: bump .4s var(--ease); }
@keyframes bump { 40% { transform: translateY(-8px) scale(1.25); } }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 32px 0 30px; }
.chip { font: inherit; font-weight: 700; font-size: .95rem; min-height: 46px; padding: 8px 20px; border-radius: 999px; border: 2px solid var(--line); background: var(--white); color: var(--ink); cursor: pointer; transition: all .2s var(--ease); }
.chip:hover { border-color: var(--sea); }
.chip[aria-pressed="true"] { background: var(--coral); border-color: var(--coral); color: var(--white); transform: rotate(-2deg); }
.list { display: grid; gap: 22px; }
/* "All tours": photo tiles */
.ogrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 18px; }
.ocard { position: relative; display: block; aspect-ratio: 4 / 3.2; max-width: 100%; border-radius: 22px; overflow: hidden; text-decoration: none; color: var(--white); isolation: isolate; }
.ocard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -2; transition: transform .8s var(--ease); }
.ocard::before { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 40%, rgba(8,30,18,.85)); }
.ocard:hover img { transform: scale(1.07); }
.ocard span { position: absolute; left: 18px; right: 18px; bottom: 16px; display: grid; gap: 2px; }
.ocard small { font-size: .78rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: #BFE6CD; }
.ocard b { font-family: var(--display); font-weight: 400; font-size: 1.45rem; line-height: 1.2; }
@media (max-width: 560px) { .ogrid { grid-template-columns: 1fr; gap: 14px; } .ocard { aspect-ratio: 4 / 3; } .ocard b { font-size: 1.3rem; } }
.tc { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); background: var(--sand); border-radius: 30px; overflow: hidden; min-width: 0; animation: pop .55s var(--ease) both; transform-style: preserve-3d; transition: transform .2s ease-out, box-shadow .3s; }
.tc:hover { box-shadow: 0 30px 50px -36px rgba(16,42,58,.6); }
@keyframes pop { from { transform: translateY(20px) scale(.97); } }
@media (max-width: 760px) { .tc { grid-template-columns: 1fr; } }
.tc figure { margin: 0; position: relative; min-height: 240px; overflow: hidden; }
.tc figure img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 1s var(--ease); }
.tc:hover figure img { transform: scale(1.06); }
.tc figure .badge { position: absolute; left: 16px; top: 16px; background: var(--white); color: var(--ink); font-weight: 800; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; }
.tc-body { padding: 26px 28px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.tc-body .city { font-weight: 700; color: var(--coral); font-size: .9rem; letter-spacing: .1em; text-transform: uppercase; }
.tc-body h3 { font-size: clamp(1.5rem, 1.2rem + 1vw, 2rem); }
.tc-body .desc { color: var(--muted); }
.tc-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .tc-cols { grid-template-columns: 1fr; } }
.dur { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; font-size: .9rem; color: var(--sea); background: var(--white); padding: 5px 12px; border-radius: 999px; justify-self: start; }
.tc-link { text-decoration: none; color: inherit; } .tc-link:hover { color: var(--sea); }
.more-link { justify-self: start; display: inline-flex; align-items: center; min-height: 40px; padding: 6px 16px; border-radius: 999px; background: var(--mint, #DCF1E4); color: var(--sea-d, #005A2B); font-weight: 700; font-size: .92rem; text-decoration: none; transition: background .2s; }
.more-link:hover { background: #C6E8D2; }
.tog { justify-self: start; font: inherit; font-weight: 700; font-size: .95rem; background: none; border: 0; color: var(--sea); cursor: pointer; padding: 6px 0; min-height: 40px; display: inline-flex; gap: 8px; align-items: center; }
.tog::after { content: "↓"; transition: transform .3s var(--ease); }
.tog[aria-expanded="true"]::after { transform: rotate(180deg); }
.itin { display: grid; gap: 10px; background: var(--white); border-radius: 18px; padding: 16px 18px; animation: drop .4s var(--ease); }
@keyframes drop { from { transform: translateY(-8px); clip-path: inset(0 0 100% 0); } to { clip-path: inset(0); } }
.itin h4 { margin: 0; font-size: .95rem; }
.itin ol { margin: 0; padding-left: 1.3em; color: var(--muted); font-size: .95rem; display: grid; gap: 3px; }
.itin .note { font-style: italic; font-size: .9rem; color: var(--muted); }
.price { background: var(--white); border-radius: 20px; padding: 14px; display: grid; gap: 3px; }
.price .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 10px; border-radius: 10px; font-size: .94rem; font-variant-numeric: tabular-nums; transition: background .3s; }
.price .row.on { background: var(--lemon); font-weight: 700; }
.price .tot { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-top: 6px; padding: 10px 12px; border-radius: 14px; background: var(--sea); color: var(--white); }
.price .tot span { font-size: .82rem; font-weight: 600; }
.price .tot:first-child { margin-top: 0; align-items: center; }
.price .tot:first-child span { line-height: 1.3; }
.price .tot b { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 1.8rem; line-height: 1; font-variant-numeric: tabular-nums; }
.price .kids { font-size: .82rem; color: var(--muted); padding: 2px 4px; }
.price .onreq { font-weight: 800; color: var(--coral); padding: 6px; }
.price .btn { margin-top: 8px; width: 100%; min-height: 46px; padding: 10px 18px; }
.euro { margin-top: 26px; color: var(--muted); font-size: .92rem; }

/* Wave */
.wave { display: block; width: 100%; height: 70px; background: var(--white); }
.wave path { animation: wave 6s ease-in-out infinite alternate; }
@keyframes wave { to { transform: translateX(-60px); } }
.how { background: var(--sea); color: var(--white); }
.how .pill { color: var(--sea); }
.steps { list-style: none; margin: 46px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 24px; counter-reset: s; }
.steps li { counter-increment: s; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 28px; padding: 26px; display: grid; gap: 10px; transition: transform .3s var(--ease), background .3s; }
.steps li:hover { transform: translateY(-6px); background: rgba(255,255,255,.16); }
.steps li::before { content: counter(s); width: 60px; height: 60px; border-radius: 50%; background: var(--lemon); color: var(--ink); display: grid; place-items: center; font-family: "Young Serif", Georgia, serif; font-size: 1.8rem; }
.steps h3 { font-size: 1.7rem; }
.steps p { color: #D3ECEE; }

/* Guides */
.gg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; margin-top: 44px; }
.g { background: var(--white); border-radius: 30px; padding: 28px 20px; text-align: center; display: grid; gap: 6px; justify-items: center; text-decoration: none; transition: transform .3s var(--ease); }
.g:hover { transform: translateY(-6px) rotate(1deg); }
.g .av { width: 110px; height: 110px; border-radius: 50%; display: grid; place-items: center; font-family: "Young Serif", "Noto Serif Armenian", Georgia, serif; font-size: 3rem; color: var(--white); margin-bottom: 10px; }
.g b { font-size: 1.12rem; }
.g span { color: var(--muted); font-size: .92rem; }
.g.spot { background: transparent; border: 2px dashed var(--coral); }
.g.spot .av { background: var(--white); color: var(--coral); border: 2px dashed var(--coral); animation: spin 18s linear infinite; }

/* Forms */

/* Badge (bottom right, above WhatsApp): the Pisa tower turns to show how far down the page you are */
.colo { position: fixed; z-index: 49; right: calc(18px + env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: 54px; height: 54px; border-radius: 50%; background: var(--white); box-shadow: 0 0 0 3px var(--sea), 0 12px 24px -10px rgba(20,32,25,.5); display: grid; pointer-events: none; }
.colo { width: 54px; height: 54px; place-items: center; overflow: visible; background: transparent; box-shadow: none; filter: drop-shadow(0 4px 6px rgba(20,32,25,.35)); }
.colo-scene { width: 40px; height: 26px; margin-top: 8px; perspective: 150px; transform: scale(1.05); }
.colo-ring { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transform: rotateX(-24deg); will-change: transform; }
/* one wall piece: travertine stone, an attic band on top and three rows of dark arches */
.colo-ring i { position: absolute; left: calc(50% - 2.9px); bottom: 0; width: 5.8px; height: 22px;
  background:
    linear-gradient(#D7B27A 0 5px, #B9925C 5px 5.6px, transparent 5.6px),
    linear-gradient(transparent 0 calc(100% - 0px), #B9925C 0),
    radial-gradient(ellipse 1.5px 2.6px at 50% 100%, #6F4B2A 0 96%, transparent 100%) 0 100% / 100% 5.5px repeat-y,
    linear-gradient(#B9925C 0 .6px, transparent .6px) 0 100% / 100% 5.5px repeat-y,

  transform: rotateY(calc(var(--k) * 18deg)) translateZ(17px); backface-visibility: visible; }
.colo-ring i.low { height: 16.5px; background: radial-gradient(ellipse 1.5px 2.6px at 50% 100%, #6F4B2A 0 96%, transparent 100%) 0 100% / 100% 5.5px repeat-y, linear-gradient(#B9925C 0 .6px, transparent .6px) 0 100% / 100% 5.5px repeat-y, #E0BE86; }
.colo-ring i.lower { height: 11px; background: radial-gradient(ellipse 1.5px 2.6px at 50% 100%, #6F4B2A 0 96%, transparent 100%) 0 100% / 100% 5.5px repeat-y, linear-gradient(#B9925C 0 .6px, transparent .6px) 0 100% / 100% 5.5px repeat-y, #DDBA80; }
/* the arena floor and a green ground ring */
.colo-floor { position: absolute; left: calc(50% - 19px); bottom: -19px; width: 38px; height: 38px; border-radius: 50%;

/* Round Ital Travel logo floating between the hero videos */
.mosaic a.hero-badge { position: absolute; left: 38%; top: 40%; width: 21%; aspect-ratio: 1; z-index: 4; margin: 0; border-radius: 50%; background: #FAF6EC; align-content: center; gap: 5px;
  box-shadow: 0 0 0 5px #FFFFFF, 0 18px 30px -12px rgba(20,32,25,.55); transition: scale .5s cubic-bezier(.2,.8,.2,1);
  animation: badgeIn 1.1s cubic-bezier(.2,.8,.2,1) 3.2s both, badgeFloat 6s ease-in-out 4.3s infinite; }
/* Inside the badge, every 8 s: "Ital·Travel" zooms out from big into place, then the line and the Armenian caption follow */
.mosaic a.hero-badge b { animation: zoomOut 8s cubic-bezier(.2,.8,.2,1) 3.7s infinite both; }
.mosaic a.hero-badge i { transform-origin: 50% 50%; animation: lineIn 8s cubic-bezier(.2,.8,.2,1) 3.7s infinite both; }
.mosaic a.hero-badge small { animation: capIn 8s cubic-bezier(.2,.8,.2,1) 3.7s infinite both; }
.mosaic a.hero-badge:hover { scale: 1.08; text-decoration: none; }
@keyframes badgeIn { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
@keyframes badgeFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
@keyframes zoomOut { 0% { opacity: 0; transform: scale(3.2); filter: blur(6px); } 14%, 92% { opacity: 1; transform: scale(1); filter: blur(0); } 100% { opacity: 0; transform: scale(.9); filter: blur(0); } }
@keyframes lineIn { 0%, 12% { transform: scaleX(0); } 22%, 92% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
@keyframes capIn { 0%, 16% { opacity: 0; transform: translateY(6px); } 26%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
.mosaic a.hero-badge b { font-size: clamp(.72rem, .45rem + .75vw, .98rem); }

@media (prefers-reduced-motion: reduce) { .mosaic a.hero-badge, .mosaic a.hero-badge b, .mosaic a.hero-badge i, .mosaic a.hero-badge small { animation: none; } }
/* With the intro video the logo waits for the end of the clip: the video fades back and the logo appears with the same animation */
.mosaic.solo a.hero-badge { left: 31%; top: calc(50% - 19% * 9 / 13); width: 38%; visibility: hidden; pointer-events: none; animation: none; }

/* Hero background: a very light Italian flag, pale green → white → pale red */

<script>
/* Anonymous visit counting: a random visitor id, the event, where the visit came from, language, device and time zone.
   No names, no cookies, nothing personal. Sent to the Ital Travel Google Sheet (see config.js).
   Only after the visitor presses "Accept" in the cookie banner (IT.consent() === "all"). */
(function () {
  var API = (window.ITAL_CONFIG || {}).API_URL || "";
  function rid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function ok() { return IT.consent() === "all"; }
  var v = null, s = null;
  function ids() {
    if (v) return;
    try { v = localStorage.getItem("it-v"); if (!v) { v = rid(); localStorage.setItem("it-v", v); } } catch (e) { v = rid(); }
    try { s = sessionStorage.getItem("it-s"); if (!s) { s = rid(); sessionStorage.setItem("it-s", s); } } catch (e) { s = rid(); }
  }
  function source() {
    var q = new URLSearchParams(location.search), u = q.get("utm_source") || q.get("src");
    if (q.get("ref")) return "Partner";
    if (u) return u.slice(0, 30);
    var r = document.referrer || "";
    if (!r) return "Direct";
    var h = ""; try { h = new URL(r).hostname.replace(/^www\./, ""); } catch (e) { return "Other"; }
    if (h === location.hostname) return "Direct";
    if (/instagram/.test(h)) return "Instagram";
    if (/facebook|fb\.|messenger/.test(h)) return "Facebook";
    if (/google\./.test(h)) return "Google";
    if (/whatsapp|wa\.me/.test(h)) return "WhatsApp";
    if (/t\.me|telegram/.test(h)) return "Telegram";
    if (/youtube/.test(h)) return "YouTube";
    if (/tiktok/.test(h)) return "TikTok";
    if (/bing|yandex|duckduckgo/.test(h)) return "Other search";
    return h.slice(0, 30);
  }
  var src = source();
  var sent = {};
  window.IT_TRACK = function (e, detail) {
    if (!API || !ok()) return;
    ids();
    var key = e + "|" + (detail || "");
    if (e !== "view" && sent[key]) return; sent[key] = 1; // count each step once per page visit
    var tz = ""; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ""; } catch (err) {}
    var body = JSON.stringify({ action: "track", e: e, d: detail || "", v: v, s: s, src: src, l: (window.IT && IT.state.lang) || "hy",
      dev: matchMedia("(max-width: 760px)").matches ? "mobile" : "desktop", tz: tz, p: location.pathname });
    try {
      if (navigator.sendBeacon && navigator.sendBeacon(API, new Blob([body], { type: "text/plain;charset=utf-8" }))) return;
    } catch (err) {}
    try { fetch(API, { method: "POST", mode: "no-cors", keepalive: true, headers: { "Content-Type": "text/plain;charset=utf-8" }, body: body }); } catch (err) {}
  };
  var counted = false;
  function start() {
    if (counted || !ok()) return; counted = true;
    if (!/[?&]notrack/.test(location.search)) setTimeout(function () { window.IT_TRACK("view"); }, 600);
    if (code) {
      try { localStorage.setItem("it-ref", JSON.stringify({ c: code, t: Date.now() })); } catch (e) {}
      setTimeout(function () { window.IT_TRACK("ref_click", code); }, 700);
    }
  }

  // Partner links (?ref=CODE): remembered in this browser for 60 days (after "Accept"); the last partner link clicked counts.
  // Without "Accept" the code still counts for a booking made during this visit, but isn't saved.
  var REF_DAYS = 60;
  var code = (new URLSearchParams(location.search).get("ref") || "").trim().toUpperCase();
  if (!/^[A-Z0-9_-]{2,20}$/.test(code)) code = "";
  window.IT_REF = function () {
    if (code) return code;
    try { var o = JSON.parse(localStorage.getItem("it-ref") || "null"); if (o && Date.now() - o.t < REF_DAYS * 864e5) return o.c; } catch (e) {}
    return "";
  };
  start();
